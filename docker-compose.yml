version: '3.8'

services:
  # 1. Central PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ai_ops_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_ops_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  # 2. Redis Cache & Celery Task Broker
  redis:
    image: redis:7-alpine
    container_name: ai_ops_redis
    restart: always
    ports:
      - "6379:6379"

  # 3. FastAPI Service Layer
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ai_ops_backend
    restart: always
    depends_on:
      - postgres
      - redis
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/ai_ops_db
      - REDIS_URL=redis://redis:6379/0
      - ENV=production
    ports:
      - "8000:8000"

  # 4. Next.js Enterprise UI
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ai_ops_frontend
    restart: always
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    ports:
      - "3000:3000"

volumes:
  pgdata:
